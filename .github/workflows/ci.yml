name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: jq is present, since every stub depends on it
        run: jq --version
      - name: Run every shell selftest found in the tree
        run: |
          set -euo pipefail
          found=0
          fail=0
          while IFS= read -r t; do
            found=$((found + 1))
            echo "=== $t"
            if ! "$t"; then
              echo "FAILED: $t" >&2
              fail=1
            fi
          done < <(find . -name '*selftest*.sh' -not -path './.git/*' | sort)
          [ "$found" -gt 0 ] || { echo "no selftest found — the glob is wrong" >&2; exit 1; }
          exit "$fail"
      - name: Run the Python selftest entry points
        run: |
          set -euo pipefail
          python3 reference/issues.py selftest
          python3 conformance/validate.py --selftest

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - run: pip install --quiet pyyaml
      - name: Parse every JSON and YAML file
        run: |
          python - <<'PY'
          import json, pathlib, sys
          import yaml

          failures = []
          for path in sorted(pathlib.Path('.').rglob('*')):
              if '.git/' in str(path) or not path.is_file():
                  continue
              try:
                  if path.suffix == '.json':
                      json.loads(path.read_text())
                  elif path.suffix in ('.yml', '.yaml'):
                      yaml.safe_load(path.read_text())
                  else:
                      continue
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
              else:
                  print(f'ok {path}')

          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Compile every Python file
        run: python -m compileall -q .

  no-major:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: No breaking-change marker may reach main
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          policy() {
            printf 'no-major: %s carries a breaking-change marker.\n\n' "$1" >&2
            printf '%s\n' \
              'Every repo here is capped below its next major until the owner' \
              'lifts the cap (see WO-060). release-please reads a "!" after the' \
              'type or scope, and a BREAKING-CHANGE footer, as a major bump, so' \
              'neither may reach main. Use a plain feat: or fix: and describe' \
              'the incompatibility in the commit body as prose.' >&2
            exit 1
          }
          has_marker() {
            local msg=$1 subject=${1%%$'\n'*}
            if grep -qE '^[A-Za-z]+(\([^)]*\))?!:' <<<"$subject"; then return 0; fi
            if grep -qE '^BREAKING[ -]CHANGE:' <<<"$msg"; then return 0; fi
            return 1
          }
          if [ -n "${PR_TITLE:-}" ]; then
            if has_marker "$PR_TITLE"; then policy 'the pull request title'; fi
            for sha in $(git log --format=%H "$BASE_SHA..$HEAD_SHA"); do
              if has_marker "$(git log -1 --format=%B "$sha")"; then
                policy "commit $sha"
              fi
            done
          else
            if has_marker "$(git log -1 --format=%B "$PUSH_SHA")"; then
              policy "commit $PUSH_SHA"
            fi
          fi
          echo 'no-major: ok'
